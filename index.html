<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Sunday School Collection</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000;
  --navy:#0b1220; --navy2:#17253d; --gold:#ffc233; --gold-deep:#f0a500;
  --yellow:#FFD83D; --red:#E3262E; --cyan:#1FA3E0; --paper:#fff;
  --display:"Bangers", Impact, "Arial Black", sans-serif;
  --body:"Comic Neue", "Trebuchet MS", "Segoe UI", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body);color:var(--ink);display:flex;flex-direction:column;
  padding:max(2vh,env(safe-area-inset-top)) 2.5vw max(2vh,env(safe-area-inset-bottom));gap:2.5vh;
  background:radial-gradient(circle, rgba(31,163,224,.2) 1.3px, transparent 1.7px) 0 0/10px 10px, var(--paper);
}
:focus-visible{outline:5px solid var(--cyan);outline-offset:4px}

header{text-align:center}
h1{
  font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:.95;
  font-size:clamp(40px,6.5vw,120px);color:var(--yellow);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);
}
header p{font-size:clamp(16px,1.6vw,28px);margin-top:1vh}

.choices{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:3vw}
.door{
  position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  border:6px solid var(--ink);box-shadow:10px 10px 0 var(--ink);text-decoration:none;color:inherit;
  transition:transform .12s ease, box-shadow .12s ease;
}
.door:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:14px 14px 0 var(--ink)}
.door:active{transform:translate(4px,4px);box-shadow:4px 4px 0 var(--ink)}

/* Game Hub door: matches the hub's own navy + gold look */
.hub{background:
  repeating-conic-gradient(from 0deg at 50% 40%, rgba(255,194,51,.13) 0 6deg, transparent 6deg 18deg),
  radial-gradient(ellipse at 50% 35%, var(--navy2), var(--navy) 70%);color:#f1f5f9}
.hub .icon{
  position:absolute;inset:0 0 38% 0;display:grid;place-items:center;
  font-size:clamp(90px,13vw,230px);filter:drop-shadow(6px 6px 0 #000);
}
.hub .caption{background:var(--navy);border-top:6px solid var(--ink)}
.hub .caption h2{color:var(--gold)}

/* Lesson door: comic-book look, matches the lesson slides */
.lesson{background:#000}
.lesson img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lesson .badge{
  position:absolute;top:14px;left:14px;background:var(--red);color:#fff;border:4px solid var(--ink);
  font-family:var(--display);font-size:clamp(18px,2vw,34px);letter-spacing:.05em;padding:4px 14px 0;
  transform:rotate(-3deg);box-shadow:4px 4px 0 var(--ink);
}
.lesson .caption{background:var(--yellow);border-top:6px solid var(--ink)}
.lesson .caption h2{color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}

.caption{position:relative;padding:1.6vh 1.6vw 1.4vh}
.caption h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.2vw,84px);line-height:.95;letter-spacing:.02em}
.caption p{font-size:clamp(15px,1.4vw,26px);line-height:1.25;margin-top:.6vh}

@media (prefers-reduced-motion:reduce){.door{transition:none}}
@media (max-width:760px){
  body{height:auto;min-height:100%}
  .choices{grid-template-columns:1fr;gap:28px}
  .door{min-height:62vw}
}
</style>
</head>
<body>

<header>
  <h1>My Sunday School Collection</h1>
  <p>Pick where you want to go.</p>
</header>

<main class="choices">

  <a class="door hub" href="hub.html">
    <div class="icon" aria-hidden="true">⚡</div>
    <div class="caption">
      <h2>Game Hub</h2>
      <p>Eight games, including Quiz Showdown, Jeopardy, Word Puzzle Wheel, and Verse Voyager. Scores carry across every game.</p>
    </div>
  </a>

  <!-- ===== THIS WEEK'S LESSON: update these 5 things each week =====
       1. href        = the lesson's folder
       2. img src     = a picture from that lesson
       3. badge text  = lesson number
       4. h2          = lesson title
       5. p           = Scripture reference
  ================================================================= -->
  <a class="door lesson" href="lessons/stephen/">
    <img src="lessons/stephen/img/slide-01.webp" alt="" style="object-position:42% 35%">
    <span class="badge">This week · Lesson 29</span>
    <div class="caption">
      <h2>The Jews Resist the Holy Spirit</h2>
      <p>The story of Stephen · Acts 6:1–7:60</p>
    </div>
  </a>

</main>

</body>
</html>
